# Snap Apps — EXTERNAL uptime monitor.
#
# deploy/monitor/uptime.sh checked this API's health from anywhere EXCEPT the
# box that runs it. This workflow is the "anywhere": GitHub's runners are a
# second vantage point that survives delphi being wedged, on fire, or
# network-partitioned — the exact failure an in-box watcher cannot see.
#
# Schedule: every 15 minutes (uptime.sh is three curl calls and one TLS check;
# anything slower than 15 min risks hours of unnoticed downtime).
#
# Alerting: this off-box check relies on GitHub's own failed-run email. When
# the check fails, the last step below fails the run, and GitHub emails the
# account that owns the scheduled workflow (the person who last changed the
# schedule or the file; set under Settings -> Notifications -> Actions). No
# new secret is needed. It is also the only alarm that still works when the
# host is completely down, because the host's own alert.sh (which emails
# through SMTP) cannot run then. If the repository secret ALERT_WEBHOOK_URL
# (a Slack or Discord incoming webhook) is set, a message is posted as well.
# Secrets live in repo settings, never here.
#
# Manual run: Actions → external-uptime-monitor → Run workflow, to test the
# plumbing before trusting it.
name: external-uptime-monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions: {}

jobs:
  uptime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run the external health checks
        id: check
        run: |
          if out=$(bash deploy/monitor/uptime.sh 2>&1); then
            echo "outcome=ok" >> "$GITHUB_OUTPUT"
          else
            echo "outcome=failed" >> "$GITHUB_OUTPUT"
          fi
          echo "$out"
          {
            echo "summary<<EOF"
            echo "$out"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Alert webhook (only on failure, only if configured)
        if: steps.check.outputs.outcome == 'failed'
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
          # Via env, not interpolated into the script: the summary is command
          # output and must never be parsed as shell.
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          if [ -z "$ALERT_WEBHOOK_URL" ]; then
            echo "ALERT_WEBHOOK_URL not configured — relying on GitHub's failed-run email to notify"
            exit 0
          fi
          python3 -c 'import json,sys; print(json.dumps({"text": "snap-apps ALERT\n" + sys.stdin.read()}))' \
            < <(echo "$SUMMARY") > /tmp/payload.json
          curl -fsS -X POST -H 'Content-Type: application/json' -d @/tmp/payload.json \
            "$ALERT_WEBHOOK_URL" || echo "warning: could not post alert webhook"

      - name: Fail the run so GitHub emails the workflow owner and the Actions tab shows it
        if: steps.check.outputs.outcome == 'failed'
        env:
          SUMMARY: ${{ steps.check.outputs.summary }}
        run: |
          echo "snap-apps endpoints unhealthy:"
          echo "$SUMMARY"
          exit 1
