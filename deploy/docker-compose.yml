# Snap Apps — production compose file.
#
# Build context for api/worker/web is the REPO ROOT (`..` from here), because
# this is a pnpm workspace and both Dockerfiles need every package.json to
# resolve it. Run this file with `-f deploy/docker-compose.yml` from the repo
# root, or `cd deploy && docker compose ...` — either works, compose resolves
# `context: ..` and `env_file: .env` relative to THIS file's directory either
# way.
#
# See docs/DEPLOY.md §9 for the full runbook (first-time setup, routine
# deploy, rollback). deploy/deploy.sh drives this file; it is not meant to be
# invoked by hand for a real rollout.

name: snap-apps

x-server-build: &server-build
  context: ..
  dockerfile: apps/server/Dockerfile

services:
  postgres:
    image: postgres:17.2-alpine
    container_name: ${SNAP_PG_CONTAINER:-snap-postgres}
    restart: unless-stopped
    environment:
      POSTGRES_DB: snapapps
      # The superuser password. Nothing application-level ever connects with
      # it — deploy.sh uses `docker exec ... psql` (local socket, trust auth)
      # to run migrations and create snap_app/snap_worker, exactly as
      # packages/db/scripts/db.mjs already does for local dev. The API and
      # worker connect as snap_app/snap_worker, never as postgres — the boot
      # preflight (apps/server/src/preflight.ts) refuses to start otherwise.
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [snap-internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snapapps"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Never published to the host in production — only Caddy and, if you
    # choose to open it for psql/backup tooling, an operator's own SSH
    # tunnel. deploy/docker-compose.local.yml adds a host port for local
    # verification only.

  api:
    # Published on LOOPBACK ONLY, for a reverse proxy on this host.
    #
    # 127.0.0.1 is not decoration: without it Docker publishes on
    # 0.0.0.0 and writes its own iptables rules, which bypass ufw
    # entirely. The app would be reachable from the internet on a raw
    # unencrypted port while `ufw status` still claimed only 80/443
    # were open.
    #
    # The host port is a variable because the default collides on a
    # shared box: 4000 was already claimed by another project's vhost
    # on the target host, and binding it would have made that project's
    # domain quietly serve this app.
    ports:
      - '127.0.0.1:${API_HOST_PORT:-4000}:4000'
    build: *server-build
    image: ${SERVER_IMAGE:-snap-server}:${IMAGE_TAG:-local}
    command: ["serve"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://snap_app:${APP_DB_PASSWORD}@postgres:5432/snapapps
      # WHERE THE ORIGINALS GO, said out loud.
      #
      # The volume below is mounted at /data/storage, but nothing told the app
      # to use it. `STORAGE_DIR` defaults to `.storage` — RELATIVE — so the
      # server resolved it against its workdir and would have written every
      # captured receipt to /repo/apps/server/.storage, inside the container
      # layer, where the next deploy deletes it.
      #
      # It has not lost anything yet only because no production capture has
      # ever succeeded: the app ran on fixtures, and Android capture threw on
      # every photo until 3fd0c8b. The first real upload would have been the
      # first one lost, and nothing would have reported an error — the write
      # succeeds, it just succeeds somewhere temporary.
      #
      # Found by publishing an APK into the volume and watching the API answer
      # "nothing published" while the file sat there in plain sight.
      STORAGE_DIR: /data/storage
    volumes:
      - storage_data:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
    networks: [snap-internal]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  worker:
    build: *server-build
    image: ${SERVER_IMAGE:-snap-server}:${IMAGE_TAG:-local}
    command: ["worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # The worker's OWN role — never snap_app. It carries the one policy
      # that spans tenants (on `jobs`, and only `jobs`) so a queue consumer
      # can claim work before it has a tenant context; see
      # apps/server/src/config.ts's WORKER_DATABASE_URL comment.
      DATABASE_URL: postgres://snap_app:${APP_DB_PASSWORD}@postgres:5432/snapapps
      WORKER_DATABASE_URL: postgres://snap_worker:${APP_DB_PASSWORD}@postgres:5432/snapapps
      # The Ollama Cloud key is never baked into the image or this file — it
      # is read from a file on the HOST (OLLAMA_ENV_FILE_HOST in .env, e.g.
      # /etc/snap-apps/secrets/ollama.env, mode 0600, outside the repo) and
      # bind-mounted read-only below. This is the same
      # KEY=VALUE-file-on-disk shape apps/server/src/extraction/provider.ts
      # already reads (see readKeyFromEnvFile) — only the path changes.
      OLLAMA_ENV_FILE: /run/secrets/ollama.env
      # THE LINE THAT TURNS THE OCR STAGE ON.
      #
      # `shadow.ts` reads this and returns immediately when it is unset —
      # "absent config, absent feature". It has been unset everywhere since the
      # stage was written, which is why every stored layout in
      # apps/server/.storage read "docai-engine sidecar not reachable" and why
      # D20's calibration had nothing to calibrate against.
      #
      # Set on the WORKER only, deliberately. Extraction runs here; the api
      # container never calls the sidecar, so giving it the URL would widen the
      # blast radius of a hung sidecar to every request-serving process.
      #
      # The shadow stage still cannot break extraction: every path either
      # succeeds quietly or is caught and logged as one line, and it is bounded
      # by DOCAI_SHADOW_TIMEOUT_MS. That contract is why this can be switched on
      # without a staged rollout.
      DOCAI_SIDECAR_URL: ${DOCAI_SIDECAR_URL:-http://docai:8088}
      # Same as the api service above, and for the same reason: the worker
      # reads the originals it was told about, and it must look where they
      # were actually written.
      STORAGE_DIR: /data/storage
    volumes:
      - storage_data:/data/storage
      - ${OLLAMA_ENV_FILE_HOST:-/dev/null}:/run/secrets/ollama.env:ro
    depends_on:
      postgres:
        condition: service_healthy
      # started, NOT service_healthy: the sidecar takes ~60s to load its models
      # and the worker must not wait on it. A worker that is up with the
      # sidecar still warming does exactly what it did before this service
      # existed — shadow reads fail, are caught, and logged as one line.
      docai:
        condition: service_started
    networks: [snap-internal]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f scripts/worker.ts || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

  docai:
    # The PP-OCRv5 OCR sidecar (services/docai-engine). Internal only: never
    # published to the host, never reachable from outside the compose network.
    # It answers /read with DocDOM-shaped spans and holds no state.
    #
    # WHY IT IS HERE NOW. docs/GAPS.md A1 reads as "run the sidecar once", but
    # the load-bearing fact was that this service was not in this file at all
    # and nothing set DOCAI_SIDECAR_URL, so the OCR stage had never executed in
    # production. shadow.ts treats an unset URL as "feature absent" and returns
    # silently — correct behaviour, and exactly why it went unnoticed.
    build:
      context: ../services/docai-engine
      dockerfile: Dockerfile
      args:
        # Must match the runtime DOCAI_MODEL_TIER below, or the container
        # downloads a second model set on first use and the build-time bake
        # was wasted.
        DOCAI_MODEL_TIER: ${DOCAI_MODEL_TIER:-mobile}
    image: ${DOCAI_IMAGE:-snap-docai}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      DOCAI_MODEL_TIER: ${DOCAI_MODEL_TIER:-mobile}
      DOCAI_DEVICE: ${DOCAI_DEVICE:-cpu}
      # Stays FALSE. paddlepaddle 3.3.1's PIR executor throws
      # ConvertPirAttribute2RuntimeAttribute on both PP-OCRv5 detection models
      # with oneDNN enabled — verified, reproducible, and it leaves us with no
      # CPU accelerator at all. docs/GAPS.md A4 evaluates OpenVINO as the
      # alternative. Do not flip this without re-running that.
      DOCAI_ENABLE_MKLDNN: ${DOCAI_ENABLE_MKLDNN:-false}
      # Heuristic operating point, NOT a calibrated threshold — there is no
      # gold-set-derived value yet (D20, docs/GAPS.md B3).
      DOCAI_MIN_CONFIDENCE: ${DOCAI_MIN_CONFIDENCE:-0.3}
    networks: [snap-internal]
    healthcheck:
      # start_period is generous because the model loads at process start, not
      # lazily: a cold container is legitimately unhealthy for ~30-60s on a
      # small VPS, and a tighter window would restart-loop it forever.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8088/health | grep -q '\"ok\":true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  web:
    # Published on LOOPBACK ONLY, for a reverse proxy on this host.
    #
    # 127.0.0.1 is not decoration: without it Docker publishes on
    # 0.0.0.0 and writes its own iptables rules, which bypass ufw
    # entirely. The app would be reachable from the internet on a raw
    # unencrypted port while `ufw status` still claimed only 80/443
    # were open.
    #
    # The host port is a variable because the default collides on a
    # shared box: 3000 was already claimed by another project's vhost
    # on the target host, and binding it would have made that project's
    # domain quietly serve this app.
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3000}:3000'
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: ${WEB_IMAGE:-snap-web}:${IMAGE_TAG:-local}
    # No `command:` override. The image's own CMD runs the Next standalone
    # server directly (`node apps/web/server.js`). It used to be ['start'],
    # which paired with an `ENTRYPOINT ["pnpm"]` that the slimmed image no
    # longer has — leaving the base node image to run `node start` and
    # crash-loop on MODULE_NOT_FOUND for a file named 'start'.
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      # Server-to-server only — the browser never talks to the API directly
      # (apps/web/src/lib/config.ts). This is the compose-internal hostname,
      # not PUBLIC_URL.
      SNAP_API_URL: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    networks: [snap-internal]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── The mobile app, in a browser ─────────────────────────────────────────
  # For the dev review the app is looked at in a browser rather than installed.
  # Same React Native source, exported by Expo for web — the real app, not a
  # mock. The phone build (eas.json) is unaffected and remains the real target.
  mobile:
    image: ${MOBILE_IMAGE:-snap-mobile}:${IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: apps/mobile/Dockerfile
      args:
        # Inlined at BUILD time and unchangeable afterwards, so the image is
        # bound to one API. Empty would silently produce a fixtures-only build.
        EXPO_PUBLIC_API_URL: ${MOBILE_API_URL:?MOBILE_API_URL must be set — an empty value builds a fixtures-only app that looks healthy while touching no server}
    restart: unless-stopped
    # Loopback only; the host reverse proxy fronts it. See api/web above for
    # why the address is explicit rather than left to Docker.
    ports:
      - '127.0.0.1:${MOBILE_HOST_PORT:-3302}:3000'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3000/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    env_file: .env
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    networks: [snap-internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

networks:
  snap-internal:
    driver: bridge

volumes:
  postgres_data:
  # Legal records (originals) live here — 5-year ATO retention, see
  # docs/DEPLOY.md §9's backup section. A plain NAMED volume is fine for
  # Postgres (pg_dump is the correct backup method regardless of where its
  # files physically sit), but storage_data is a named volume BOUND to a host
  # path (STORAGE_HOST_DIR) instead of Docker-managed storage, so file-level
  # backup tooling (rsync/restic/tar) can reach the originals directly without
  # going through the Docker API, and the directory survives `docker compose
  # down -v` by construction (nothing about that host path is removed by
  # Docker even when the volume record is).
  storage_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${STORAGE_HOST_DIR:?set STORAGE_HOST_DIR in .env — where original captures persist on the host}
  caddy_data:
  caddy_config:
